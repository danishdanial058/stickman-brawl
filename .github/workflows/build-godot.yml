name: Build Godot test

# The Godot 4 test version of the game (godot/). The live game is still the HTML one.
on:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/build-godot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: '4.4.1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot and export templates
        run: |
          V="$GODOT_VERSION"
          wget -q "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip"
          wget -q "https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz"
          unzip -q "Godot_v${V}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${V}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${V}.stable"
          unzip -q "Godot_v${V}-stable_export_templates.tpz"
          mv templates/* "$HOME/.local/share/godot/export_templates/${V}.stable/"
          godot --version
          ls -la "$HOME/.local/share/godot/export_templates/${V}.stable/"

      - name: Point Godot at the Android SDK, Java and the debug key
        run: |
          # let Godot write its own editor settings first, then add the Android paths (like the godot-ci image)
          godot --headless -e --quit --path godot 2>&1 | tail -3 || true
          ls "$HOME/.config/godot" || true
          F="$HOME/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres"
          case "$GODOT_VERSION" in *.*.*) F="$HOME/.config/godot/editor_settings-$(echo $GODOT_VERSION | cut -d. -f1-2).tres";; esac
          test -f "$F" || printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$F"
          {
            echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$GITHUB_WORKSPACE/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } >> "$F"
          echo "settings file: $F"; tail -8 "$F"
          ls "$ANDROID_SDK_ROOT/build-tools" | tail -3

      - name: Import the project
        working-directory: godot
        run: godot --headless --path . --import 2>&1 | tail -20 || true

      - name: Self-test (a full CPU vs CPU match; fails on any script error)
        working-directory: godot
        run: |
          timeout 300 godot --headless --path . -- --selftest 2>&1 | tee selftest.log
          grep -q "SELFTEST OK" selftest.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" selftest.log; then exit 1; fi

      - name: Export web and Android
        working-directory: godot
        run: |
          mkdir -p build/web build/android
          touch build/.gdignore
          godot --headless --path . --export-release "Web" build/web/index.html 2>&1 | tail -20
          godot --headless --verbose --path . --export-debug "Android" build/android/StickmanBrawlGodot.apk 2>&1 | grep -iv "reimport\|scan\|loading_editor\|savepack" | tail -60
          ls -la build/web build/android
          test -f build/web/index.html
          test -f build/android/StickmanBrawlGodot.apk
          (cd build/web && zip -qr ../../StickmanBrawlGodot-web.zip .)

      - name: Publish the test builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "godot-test-${{ github.run_number }}" \
            godot/build/android/StickmanBrawlGodot.apk godot/StickmanBrawlGodot-web.zip \
            --prerelease --title "Godot test ${{ github.run_number }}" \
            --notes "Godot 4 test build: Street Brawler vs CPU on the Notebook arena, with the notebook VFX. StickmanBrawlGodot.apk installs on Android. The web zip must be served from a web server (it can't run by double-clicking index.html)."
