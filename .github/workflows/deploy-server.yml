name: Deploy server

# Deploys the online server (cloudflare/) to Cloudflare Workers.
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token with the "Edit Cloudflare Workers" permissions
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
#   TURN_KEY_ID            Realtime > TURN Server key: the Turn Token ID
#   TURN_KEY_API_TOKEN     Realtime > TURN Server key: the API Token
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are set
        id: chk
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          K: ${{ secrets.TURN_KEY_ID }}
          S: ${{ secrets.TURN_KEY_API_TOKEN }}
        run: |
          for v in T A K S; do if [ -z "${!v}" ]; then echo "::warning::Not deployed: a Cloudflare secret is missing. Add all four in Settings > Secrets and variables > Actions, then run this again."; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; fi; done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.chk.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          secrets: |
            TURN_KEY_ID
            TURN_KEY_API_TOKEN
        env:
          TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
          TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
