name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Use this repository's signing key
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; fi

      - name: Create the Android project around index.html
        run: |
          set -e
          mkdir -p app/src/main/assets/fonts app/src/main/res/values app/src/main/java/com/stickmanbrawl/game
          if [ ! -f index.html ]; then echo 'index.html is missing. Upload it to the top of the repository.'; exit 1; fi
          cp index.html app/src/main/assets/index.html
          cat > 'settings.gradle' <<'END_OF_FILE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "StickmanBrawl"
          include ':app'
          END_OF_FILE
          cat > 'build.gradle' <<'END_OF_FILE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          END_OF_FILE
          cat > 'gradle.properties' <<'END_OF_FILE'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          END_OF_FILE
          cat > 'app/build.gradle' <<'END_OF_FILE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.stickmanbrawl.game'
              compileSdk 34

              defaultConfig {
                  applicationId "com.stickmanbrawl.game"
                  minSdk 24
                  targetSdk 34
                  versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
                  versionName "1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          END_OF_FILE
          cat > 'app/src/main/AndroidManifest.xml' <<'END_OF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <!-- Only used to open web links in the browser. The game itself runs offline. -->
              <uses-permission android:name="android.permission.INTERNET" />
          
              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">
          
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboard|keyboardHidden|navigation|uiMode"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          END_OF_FILE
          cat > 'app/src/main/res/values/strings.xml' <<'END_OF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Stickman Brawl</string>
          </resources>
          END_OF_FILE
          cat > 'app/src/main/res/values/styles.xml' <<'END_OF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="desk">#FFDDE6F0</color>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar.Fullscreen">
                  <item name="android:windowBackground">@color/desk</item>
                  <item name="android:statusBarColor">@color/desk</item>
                  <item name="android:navigationBarColor">@color/desk</item>
              </style>
          </resources>
          END_OF_FILE
          cat > 'app/src/main/java/com/stickmanbrawl/game/MainActivity.java' <<'END_OF_FILE'
          package com.stickmanbrawl.game;
          
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          
          /**
           * Stickman Brawl runs as a web page (assets/index.html) inside a full-screen WebView.
           * This class sets up the WebView, hides the system bars, and forwards the
           * Back button and "app went to background" events to the game.
           */
          public class MainActivity extends Activity {
          
              private WebView web;
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      getWindow().getAttributes().layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  }
          
                  web = new WebView(this);
                  web.setBackgroundColor(0xFFDDE6F0);
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
          
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);                 // the game is JavaScript
                  s.setDomStorageEnabled(true);                 // saves unlocks and best scores
                  s.setMediaPlaybackRequiresUserGesture(false); // lets the music and sound effects play
                  s.setAllowFileAccess(true);                   // loads files from the app's assets
                  s.setTextZoom(100);                           // ignore the phone's font-size setting
          
                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri url = request.getUrl();
                          if ("file".equals(url.getScheme())) {
                              return false; // our own pages stay inside the app
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, url)); // web links open in the browser
                          } catch (ActivityNotFoundException ignored) {
                          }
                          return true;
                      }
                  });
          
                  setContentView(web);
                  hideSystemBars();
          
                  if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      web.loadUrl("file:///android_asset/index.html");
                  }
              }
          
              @SuppressWarnings("deprecation")
              private void hideSystemBars() {
                  View decor = getWindow().getDecorView();
                  decor.setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
              }
          
              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      hideSystemBars();
                  }
              }
          
              @Override
              protected void onPause() {
                  if (web != null) {
                      web.evaluateJavascript("window.appPause && window.appPause()", null);
                      web.onPause();
                  }
                  super.onPause();
              }
          
              @Override
              protected void onResume() {
                  super.onResume();
                  if (web != null) {
                      web.onResume();
                  }
              }
          
              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (web != null) {
                      web.saveState(outState);
                  }
              }
          
              /** Back pauses the fight, then quits to the menu; on the menu it closes the app. */
              @SuppressWarnings("deprecation")
              @Override
              public void onBackPressed() {
                  if (web == null) {
                      super.onBackPressed();
                      return;
                  }
                  web.evaluateJavascript("window.appBack ? window.appBack() : false", value -> {
                      if (!"true".equals(value)) {
                          finish();
                      }
                  });
              }
          
              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.destroy();
                      web = null;
                  }
                  super.onDestroy();
              }
          }
          END_OF_FILE
          cat > 'make_icons.py' <<'END_OF_FILE'
          import math, os
          from PIL import Image, ImageDraw
          def icon(size):
              S=size*4
              im=Image.new('RGBA',(S,S),(0,0,0,0)); d=ImageDraw.Draw(im)
              d.rounded_rectangle([0,0,S-1,S-1],radius=S*0.22,fill=(246,201,40,255),outline=(27,35,51,255),width=int(S*.04))
              ink=(27,35,51,255); lw=int(S*.055)
              def man(cx,col,face,punch):
                  hip=(cx,S*.70); neck=(cx+face*S*.03,S*.45); hr=S*.085; hc=(neck[0]+face*S*.01,neck[1]-hr*1.05)
                  d.line([hip,neck],fill=col,width=lw)
                  d.line([hip,(cx-face*S*.09,S*.86)],fill=col,width=lw); d.line([hip,(cx+face*S*.08,S*.86)],fill=col,width=lw)
                  sh=(neck[0],neck[1]+S*.03)
                  if punch: d.line([sh,(sh[0]+face*S*.2,sh[1]-S*.01)],fill=col,width=lw)
                  else: d.line([sh,(sh[0]+face*S*.08,sh[1]+S*.08),(sh[0]+face*S*.14,sh[1])],fill=col,width=lw,joint='curve')
                  d.line([sh,(sh[0]-face*S*.07,sh[1]+S*.1)],fill=col,width=lw)
                  d.ellipse([hc[0]-hr,hc[1]-hr,hc[0]+hr,hc[1]+hr],fill=(255,255,255,255),outline=col,width=lw)
              man(S*.34,(29,79,215,255),1,True); man(S*.70,(209,53,43,255),-1,False)
              cx,cy=S*.535,S*.42
              pts=[(cx+math.cos(k*math.pi/8)*S*(.085 if k%2==0 else .04),cy+math.sin(k*math.pi/8)*S*(.085 if k%2==0 else .04)) for k in range(16)]
              d.polygon(pts,fill=(255,255,255,255),outline=ink,width=int(S*.015))
              return im.resize((size,size),Image.LANCZOS)
          for name,sz in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              p='app/src/main/res/mipmap-%s'%name
              os.makedirs(p,exist_ok=True)
              icon(sz).save(p+'/ic_launcher.png')
          END_OF_FILE
          pip install --quiet pillow
          python3 make_icons.py

      - name: Download the game fonts
        run: |
          curl -fsSL -o app/src/main/assets/fonts/PermanentMarker-Regular.ttf https://github.com/google/fonts/raw/main/apache/permanentmarker/PermanentMarker-Regular.ttf || echo "Font download failed, the app will use built-in fonts"
          curl -fsSL -o app/src/main/assets/fonts/PatrickHand-Regular.ttf https://github.com/google/fonts/raw/main/ofl/patrickhand/PatrickHand-Regular.ttf || echo "Font download failed, the app will use built-in fonts"

      - name: Build the APK
        run: gradle assembleDebug --no-daemon

      - name: Rename the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk StickmanBrawl.apk

      - name: Upload the APK to this run
        uses: actions/upload-artifact@v4
        with:
          name: StickmanBrawl-apk
          path: StickmanBrawl.apk

      - name: Publish the APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Stickman Brawl build ${{ github.run_number }}
          body: Download StickmanBrawl.apk below and open it on your Android phone to install.
          files: StickmanBrawl.apk
